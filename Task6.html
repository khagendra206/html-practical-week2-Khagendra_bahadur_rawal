<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student Registration Form</title>
    <style>
        /* Optional basic styling to cleanly align the form elements */
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .inline-label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }
        input[type="text"], input[type="email"], input[type="password"], select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        textarea {
            resize: vertical;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Student Registration Form</h2>

    <form action="#" method="POST">

        <!-- Text, Email, and Password Inputs -->
        <div class="form-group">
            <label for="student-name">Full Name:</label>
            <input type="text" id="student-name" name="student_name" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="student-email">Email Address:</label>
            <input type="email" id="student-email" name="student_email" placeholder="username@example.com" required>
        </div>

        <div class="form-group">
            <label for="student-password">Password:</label>
            <input type="password" id="student-password" name="student_password" required>
        </div>

        <!-- Radio Buttons (Gender) -->
        <div class="form-group">
            <label>Gender:</label>
            <input type="radio" id="gender-male" name="gender" value="male">
            <label for="gender-male" class="inline-label">Male</label>

            <input type="radio" id="gender-female" name="gender" value="female">
            <label for="gender-female" class="inline-label">Female</label>

            <input type="radio" id="gender-other" name="gender" value="other">
            <label for="gender-other" class="inline-label">Other</label>
        </div>

        <!-- Checkboxes (Interests) -->
        <div class="form-group">
            <label>Interests:</label>
            <input type="checkbox" id="interest-coding" name="interests" value="coding">
            <label for="interest-coding" class="inline-label">Coding</label>

            <input type="checkbox" id="interest-sports" name="interests" value="sports">
            <label for="interest-sports" class="inline-label">Sports</label>

            <input type="checkbox" id="interest-music" name="interests" value="music">
            <label for="interest-music" class="inline-label">Music</label>
        </div>

        <!-- Dropdown Select (Department) -->
        <div class="form-group">
            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="">-- Select a Department --</option>
                <option value="cs">Computer Science</option>
                <option value="it">Information Technology</option>
                <option value="ee">Electrical Engineering</option>
                <option value="me">Mechanical Engineering</option>
            </select>
        </div>

        <!-- Textarea (About You) -->
        <div class="form-group">
            <label for="about-you">About You:</label>
            <textarea id="about-you" name="about_you" rows="4" placeholder="Tell us a little about yourself..."></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit">Submit Registration</button>

    </form>

</body>
</html>
