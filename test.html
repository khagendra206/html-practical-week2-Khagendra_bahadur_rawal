<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khagendra Bahadur Rawal | Portfolio</title>

    <style>
        /* =========================
           BASIC SETTINGS
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1120;
            color: #ffffff;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           NAVIGATION BAR
        ========================== */

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 17, 32, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid #1e293b;
        }

        nav {
            max-width: 1200px;
            margin: auto;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #38bdf8;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            color: #cbd5e1;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #38bdf8;
        }

        .menu-btn {
            display: none;
            font-size: 28px;
            cursor: pointer;
            color: white;
        }

        /* =========================
           GENERAL SECTION
        ========================== */

        section {
            max-width: 1200px;
            margin: auto;
            padding: 100px 30px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .section-title span {
            color: #38bdf8;
        }

        .section-title p {
            color: #94a3b8;
        }

        /* =========================
           HOME
        ========================== */

        #home {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 120px;
        }

        .home-content {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 50px;
            align-items: center;
        }

        .home-text h4 {
            color: #38bdf8;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .home-text h1 {
            font-size: 60px;
            line-height: 1.1;
            margin-bottom: 15px;
        }

        .home-text h1 span {
            color: #38bdf8;
        }

        .home-text h3 {
            color: #cbd5e1;
            font-size: 25px;
            margin-bottom: 20px;
        }

        .home-text p {
            color: #94a3b8;
            max-width: 650px;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .buttons {
        }
    </style>
    </head>
