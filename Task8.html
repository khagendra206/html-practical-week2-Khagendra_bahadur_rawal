<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Media Hub</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQGkgzimjvaS9GOz-U7mB1GC1-dOOiH9YJ3lG1OWy79DV_x6CSvHP8oHGkP&s=10" width="25">

    <!-- Apply Google Font to main heading -->
    <style>
        h1 {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Media Hub</h1>

        <nav>
            <a href="https://youtu.be/GrlAInfP990?si=v9XyK6hc92wMbREI">YouTube Video</a> |
            <a href="#local-video">Local Video</a> |
            <a href="https://audiomack.com/devsaolcom/song/kheladi">Audio</a> |
            <a href="#map">Map</a> |
            <a href="#webpage">Webpage</a> |
            <a href="#pdf">PDF</a>
        </nav>
    </header>

    <main>

        <section id="video">
            <h2>YouTube Video</h2>

            <iframe
                width="560"
                height="315"
                src="https://youtu.be/GrlAInfP990?si=CpBQRCQfB5s7mjLB"
                title="YouTube video"
                alt="Sajjan raj vaidya song."
                allowfullscreen>
            </iframe>
        </section>

        <hr>

        <section id="local-video">
            <h2>Local Video</h2>

            <video width="600" controls>
                <source src="my-video.mp4" type="mp4">
                <source src="my-video.webm" type="video">
                Your browser does not support the video tag.
            </video>
        </section>

        <hr>

        <section id="audio">
            <h2>Audio Clip</h2>

            <audio controls>
                <source src="https://audiomack.com/devsaolcom/song/kheladi" type="audio/mpeg">
                <!--Your browser does not support the audio element.-->
            </audio>
        </section>

        <hr>

        <section id="map">
            <h2>Google Map</h2>

            <iframe
                src="https://www.google.com/maps?q=PCPS%20College%20Kupondole%20Nepal&output=embed"
                width="500"
                height="450"
                title="PCPS College Location">
            </iframe>
        </section>

        <hr>

        <section id="webpage">
            <h2>External Webpage</h2>

            <iframe
                src="https://en.wikipedia.org/wiki/Web_page"
                alt="Wikipedia"
                width="800"
                height="500"
                title="External webpage">
            </iframe>
        </section>

        <hr>

        <section id="pdf">
            <h2>PDF Document</h2>

            <embed
                src="c:\Users\DELL\Downloads\CIS020-1-CIS093-1_Programming_Lab2 - Tagged.pdf"
                type="pdf"
                width="800"
                height="600">
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Media Hub</p>
    </footer>

</body>
</html>
