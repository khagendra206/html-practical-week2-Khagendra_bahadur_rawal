<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Media Hub</title>
    
    <!-- Add a favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Link a Google Font (Poppins used here) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Apply Google Font to the main heading and structure the layout */
        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: #333;
            text-align: center;
        }
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .media-container {
            margin-bottom: 40px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        iframe, embed, object {
            width: 100%;
            border: none;
            border-radius: 4px;
        }
        video {
            width: 100%;
            max-width: 600px;
            display: block;
        }
        audio {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Media Hub</h1>
    </header>

    <main>
        <!-- 1. YouTube Video via iframe -->
        <section class="media-container">
            <h2>1. Embedded YouTube Video</h2>
            <iframe width="560" height="315" src="https://youtube.com" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </section>

        <!-- 2. Local Video with 2 source fallbacks -->
        <section class="media-container">
            <h2>2. Local Video Player</h2>
            <video controls>
                <source src="videos/sample.mp4" type="video/mp4">
                <source src="videos/sample.webm" type="video/webm">
                Your browser does not support the video tag.
            </video>
        </section>

        <!-- 3. Audio Clip with controls -->
        <section class="media-container">
            <h2>3. Audio Clip Player</h2>
            <audio controls>
                <source src="audio/music.mp3" type="audio/mpeg">
                <source src="audio/music.ogg" type="audio/ogg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <!-- 4. Google Map Location (PCPS College, Kupondole) -->
        <section class="media-container">
            <h2>4. Google Map Location</h2>
            <iframe src="https://google.com" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>

        <!-- 5. External Webpage via iframe -->
        <section class="media-container">
            <h2>5. External Webpage</h2>
            <iframe src="https://example.com" height="400"></iframe>
        </section>

        <!-- 6. PDF Document via object/embed -->
        <section class="media-container">
            <h2>6. Embedded PDF Document</h2>
            <object data="documents/sample.pdf" type="application/pdf" width="100%" height="500px">
                <p>Alternative text: Your browser doesn't support embedded PDFs. <a href="documents/sample.pdf">Click here to download the PDF.</a></p>
            </object>
        </section>
    </main>

</body>
</html>
