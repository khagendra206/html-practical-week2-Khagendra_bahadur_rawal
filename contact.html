<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Contact</title>
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>

<header>
    <h1>Contact Me</h1>

    <nav>
        <a href="/index.html">Home</a> 
        <a href="/about.html">About</a> 
        <a href="/contact.html">Contact</a>
    </nav>
</header>

<main>

    <section>
        <h2>Get in Touch</h2>

        <address>
            <p>
                Email:
                <a href="mailto:yourname@example.com">
                    yourname@example.com
                </a>
            </p>

            <p>Phone: +977-98XXXXXXXX</p>

            <p>Location: Kathmandu, Nepal</p>
        </address>
    </section>

    <section>
        <h2>Contact Form</h2>

        <form action="#" method="post">

            <p>
                <label for="name">Full Name:</label><br>
                <input type="text"
                       id="name"
                       name="name"
                       required>
            </p>

            <p>
                <label for="email">Email:</label><br>
                <input type="email"
                       id="email"
                       name="@email.com"
                       required>
            </p>

            <p>
                <label for="phone">Phone:</label><br>
                <input type="tel"
                       id="phone"
                       name="phone">
            </p>

            <p>
                <label for="subject">Subject:</label><br>
                <input type="text"
                       id="subject"
                       name="subject">
            </p>

            <p>
                <label for="message">Message:</label><br>
                <textarea id="message"
                          name="message"
                          rows="6"
                          cols="40"
                          required></textarea>
            </p>

            <p>
                <input type="submit" value="Send Message">
                <input type="reset" value="Clear">
            </p>

        </form>
    </section>

    <section>
        <h2>My Location</h2>

        <iframe
            src="https://www.google.com/maps?q=PCPS%20College%20Kupondole%20Nepal&output=embed"
            width="600"
            height="400"
            title="PCPS College Location">
        </iframe>
    </section>

</main>

<footer>
    <p>&copy; 2026 Khagendra. All rights reserved.</p>
</footer>

</body>
</html>
